[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs before each new version starts. If it fails, the deploy is cancelled
# and the old version keeps serving, so a broken migration never goes live.
preDeployCommand = ["/migrate up"]

# Railway only sends traffic to the new version once this returns 200.
healthcheckPath = "/healthz"
healthcheckTimeout = 60

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
