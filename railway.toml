[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Database migrations run inside the server at startup (RUN_MIGRATIONS=true).

# Railway only sends traffic to the new version once this returns 200.
healthcheckPath = "/healthz"
healthcheckTimeout = 60

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
