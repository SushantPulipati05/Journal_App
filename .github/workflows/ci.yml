name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The tests start a throwaway Postgres with Docker (testcontainers).
      # GitHub's Linux runners already have Docker, so nothing else is needed.
      - name: Test (with race detector)
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t journal-server:ci .